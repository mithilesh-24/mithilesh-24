<svg xmlns="http://www.w3.org/2000/svg" width="800" height="180" viewBox="0 0 800 180" role="img" aria-label="Any fool can write code that a computer can understand. Good programmers write code that humans can understand. — Martin Fowler">
  <rect width="800" height="180" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="40" y="70" font-family="Georgia, 'Times New Roman', serif" font-size="64" fill="#58a6ff" opacity="0.6">“</text>
  <text x="400" y="78" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#e6edf3">Any fool can write code that a computer can understand.</text>
  <text x="400" y="110" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#e6edf3">Good programmers write code that humans can understand.</text>
  <text x="400" y="150" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e">— Martin Fowler</text>
</svg>
